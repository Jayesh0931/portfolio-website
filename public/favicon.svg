<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .dashed-circle {
      stroke: #190b00;
      transition: stroke 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      .dashed-circle {
        stroke: #FFFDFA;
      }
    }
  </style>
  <!-- Solid Orange Circle -->
  <circle cx="38" cy="50" r="30" fill="#EE6C13" />
  <!-- Dashed Outline Circle -->
  <circle class="dashed-circle" cx="62" cy="50" r="27" fill="none" stroke-width="4" stroke-dasharray="6 4" />
</svg>
